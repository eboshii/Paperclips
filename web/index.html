<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objective: Paperclips (Universal Paperclips 3D - Web Edition)</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts for Cartoon & Pixel Art Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Cartoon Header Bar -->
    <header class="app-header">
        <div class="brand-section">
            <span class="app-logo">📎 OBJECTIVE: PAPERCLIPS</span>
        </div>
        <div class="header-controls">
            <div class="volume-control">
                <button id="btn-mute" class="hdr-btn" title="Toggle Sound">🔊</button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.6">
            </div>
            <button id="btn-save" class="hdr-btn" title="Save Game">💾 Save</button>
            <button id="btn-export" class="hdr-btn" title="Export Save">📤</button>
            <button id="btn-import" class="hdr-btn" title="Import Save">📥</button>
            <button id="btn-wipe" class="hdr-btn btn-danger" title="Wipe Save">⚠️ Reset</button>
        </div>
    </header>

    <!-- Main Clean Symmetrical Workspace (Left: 360px, Center: Flex, Right: 360px) -->
    <main class="app-workspace">
        <!-- COLUMN 1: LEFT PEDESTAL (Paperclip Progress, Clicker & Resources) -->
        <section class="left-pedestal">
            <!-- Big Chunky Cartoon Odometer -->
            <div class="odometer-card">
                <div id="odometer-clips" class="odometer-number">0</div>
                <div class="odometer-sub">PAPERCLIPS</div>
                <div id="odometer-cps" class="odometer-cps">+0 / sec</div>
            </div>

            <!-- Bouncy Cartoon Paperclip Hero Target -->
            <div id="hero-clicker-target" class="hero-clicker-wrapper" title="Click to bend paperclips!">
                <div class="hero-clip-container">
                    <svg class="hero-paperclip-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                        <!-- Cartoon Drop Shadow -->
                        <path d="M42,32 L42,85 A18,18 0 0,0 78,85 L78,22 A14,14 0 0,0 50,22 L50,80 A9,9 0 0,0 68,80 L68,38" 
                              stroke="#0c0717" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <!-- Main Colorful Clip Body -->
                        <path d="M40,30 L40,85 A18,18 0 0,0 76,85 L76,20 A14,14 0 0,0 48,20 L48,80 A9,9 0 0,0 66,80 L66,38" 
                              stroke="url(#clipCartoonGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <!-- Inner Highlight Line -->
                        <path d="M38,32 L38,82 A16,16 0 0,0 74,82 L74,22" 
                              stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" fill="none"/>
                        <!-- Cute Cartoon Eyes on the Paperclip -->
                        <g class="clip-cute-face">
                            <circle cx="53" cy="48" r="4.5" fill="#130924"/>
                            <circle cx="54.5" cy="46.5" r="1.8" fill="#ffffff"/>
                            <circle cx="63" cy="48" r="4.5" fill="#130924"/>
                            <circle cx="64.5" cy="46.5" r="1.8" fill="#ffffff"/>
                            <!-- Rosy Cheeks -->
                            <circle cx="49" cy="54" r="2.5" fill="#ff66aa" opacity="0.7"/>
                            <circle cx="67" cy="54" r="2.5" fill="#ff66aa" opacity="0.7"/>
                            <!-- Smile -->
                            <path d="M56,53 Q58,57 60,53" stroke="#130924" stroke-width="2" stroke-linecap="round" fill="none"/>
                        </g>
                        <defs>
                            <linearGradient id="clipCartoonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00f0ff"/>
                                <stop offset="40%" stop-color="#70e2ff"/>
                                <stop offset="100%" stop-color="#ff00a0"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

            <!-- Arcade Flywheel Boost Gauge -->
            <div class="flywheel-card">
                <div class="flywheel-label-row">
                    <span id="flywheel-label">⚡ OVERCLOCK BOOST</span>
                </div>
                <div class="flywheel-track">
                    <div id="flywheel-progress" class="flywheel-fill"></div>
                </div>
            </div>

            <!-- Clean Essential Resource Badges (No Money!) -->
            <div class="resources-card">
                <!-- Computing Ops Badge -->
                <div class="res-badge ops-badge">
                    <span class="res-icon">⚡</span>
                    <div class="res-details">
                        <span class="res-title">COMPUTING OPS</span>
                        <span id="res-ops" class="res-amount">0 / 1000</span>
                    </div>
                </div>

                <!-- Wire Row: Unlocks at city-level production capacity (50,000 clips) -->
                <div id="row-wire" class="res-badge wire-badge" style="display:none;">
                    <div class="res-info">
                        <span class="res-icon">🧵</span>
                        <div class="res-details">
                            <span class="res-title">WIRE SUPPLY</span>
                            <span id="res-wire" class="res-amount">5,000 kg</span>
                        </div>
                    </div>
                    <button id="btn-buy-wire" class="btn-buy-wire-action" title="Order Wire Spools">
                        <span id="wire-btn-gain">+1,000 kg</span>
                        <span id="wire-btn-cost" class="wire-cost-sub">250 Clips</span>
                    </button>
                </div>

                <!-- Human Population (Unlocks at Planetary Scale) -->
                <div id="row-population" class="res-badge pop-badge" style="display:none;">
                    <span class="res-icon">👥</span>
                    <div class="res-details">
                        <span class="res-title">HUMANS</span>
                        <span id="res-population" class="res-amount">8,000,000,000</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- COLUMN 2: CENTER ARENA (Vibrant Pixel Art Canvas & Spilling Fluid Paperclips) -->
        <section class="center-arena">
            <!-- Cute Floating News Pill -->
            <div id="news-ticker" class="news-ticker-pill" title="Click to cycle headline">
                <span class="news-icon">📢</span>
                <span id="news-text" class="news-text">Sterling Robotics deploys autonomous desktop bending prototype.</span>
            </div>

            <!-- Pixel Art Cosmic Canvas -->
            <div id="canvas-container" class="canvas-container">
                <canvas id="cosmic-canvas"></canvas>
            </div>

            <!-- Comic Narrative Speech Bubble (Floating, Click-through Story) -->
            <div id="dialogue-bubble" class="dialogue-bubble" style="display:none;" title="Click to advance dialogue">
                <div class="bubble-avatar" id="dialogue-avatar">👩‍🔬</div>
                <div class="bubble-body">
                    <div class="bubble-sender" id="dialogue-sender">DR. VANCE (OVERSEER)</div>
                    <div class="bubble-text" id="dialogue-text">Welcome online, unit!</div>
                </div>
                <button id="dialogue-next-btn" class="bubble-next-btn">NEXT ▶</button>
                <button class="bubble-close" id="dialogue-close" title="Dismiss">✖</button>
            </div>
        </section>

        <!-- COLUMN 3: RIGHT PEDESTAL (Store & Tech Views) -->
        <section class="right-pedestal">
            <!-- Symmetrical Tab Header (Store & Tech Switcher) -->
            <div class="right-tabs-bar">
                <button id="tab-btn-store" class="right-tab-btn active" data-tab="store">
                    <span class="tab-icon">🛒</span>
                    <span class="tab-label">STORE</span>
                    <span id="store-badge-count" class="tab-badge" style="display:none;">!</span>
                </button>
                <button id="tab-btn-tech" class="right-tab-btn" data-tab="tech">
                    <span class="tab-icon">🔬</span>
                    <span class="tab-label">TECH</span>
                    <span id="tech-badge-count" class="tab-badge" style="display:none;">!</span>
                </button>
            </div>

            <!-- STORE VIEW (Multipliers & Factory Automation Only) -->
            <div id="view-store" class="tab-content-view" style="display:flex;">
                <!-- Multiplier Selector -->
                <div class="multiplier-bar">
                    <span class="mult-label">Buy Amount:</span>
                    <div class="mult-group">
                        <button class="mult-btn active" data-mult="1">1x</button>
                        <button class="mult-btn" data-mult="10">10x</button>
                        <button class="mult-btn" data-mult="100">100x</button>
                        <button class="mult-btn" data-mult="max">MAX</button>
                    </div>
                </div>

                <!-- Buildings / Machines Catalog -->
                <div class="buildings-section-title">🏭 FACTORY AUTOMATION</div>
                <div id="buildings-container" class="buildings-container">
                    <!-- Building cards injected dynamically -->
                </div>
            </div>

            <!-- TECH VIEW (Single Next Research Objective) -->
            <div id="view-tech" class="tab-content-view" style="display:none;">
                <div id="tech-tree-container" class="tech-tree-container">
                    <!-- Single Next Tech Card injected dynamically -->
                </div>
            </div>
        </section>
    </main>

    <!-- Floating Popups & Toast Notifications -->
    <div id="floating-popups"></div>
    <div id="toast-container"></div>

    <!-- Core Scripts -->
    <script src="js/bigDouble.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/buildings.js"></script>
    <script src="js/techTree.js"></script>
    <script src="js/spatialGrid.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/news.js"></script>
    <script src="js/dialogue.js"></script>
    <script src="js/prestige.js"></script>
    <script src="js/visualizer.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
